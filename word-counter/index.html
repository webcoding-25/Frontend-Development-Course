<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Word Counter</title>

	<style>
		body{
			font-family: Arial, Helvetica, sans-serif;
			padding: 30px;
		}
		textarea{
			width: 100%;
			height: 150px;
			padding: 12px;
			font-size: 16px;
		}
		button{
			padding: 10px;
			margin: 6px;
			font-size: 16px;
		}
		.output-box{
			font-size: 16px;
			border: 2px solid;
			padding: 12px;
			height: 100px;
		}

	</style>
</head>
<body>
	<h2>Simple Word Counter Program</h2>

	<textarea name="" id="textBox" placeholder="Type your text here..."></textarea>
<br>
<br>
	<button type="submit" onclick="countLength()">Count Length</button>
	<button type="submit" onclick="trim()">Trim</button>
	<button type="submit" onclick="uppercase()">To Uppercase</button>
	<button type="submit" onclick="lowercase()">To Lowercase</button>
	<button type="submit" onclick="countWord()">Count Word</button>

	<br>
	<br>
	<br>
	<div class="output-box" id="outputBox">Output will appear here...</div>




	<script src="index.js"></script>
</body>
</html>
